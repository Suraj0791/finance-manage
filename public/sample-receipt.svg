<svg width="400" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="600" rx="12" fill="#0f172a"/>
  <!-- Card background -->
  <rect width="340" height="520" x="30" y="40" rx="8" fill="#ffffff"/>
  
  <!-- Receipt text content -->
  <text x="200" y="90" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">ORGANIC GROCERY CO.</text>
  <text x="200" y="115" font-family="'Courier New', Courier, monospace" font-size="11" fill="#64748b" text-anchor="middle">100 Green Garden Blvd, Suite A</text>
  <text x="200" y="130" font-family="'Courier New', Courier, monospace" font-size="11" fill="#64748b" text-anchor="middle">Date: 2026-05-15  14:32</text>
  <text x="200" y="145" font-family="'Courier New', Courier, monospace" font-size="11" fill="#64748b" text-anchor="middle">Receipt #: 987654321</text>
  
  <line x1="50" y1="170" x2="350" y2="170" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  
  <!-- Items list -->
  <text x="60" y="210" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#334155">1x Almond Milk</text>
  <text x="340" y="210" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#334155" text-anchor="end">$4.50</text>
  
  <text x="60" y="245" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#334155">1x Whole Grain Bread</text>
  <text x="340" y="245" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#334155" text-anchor="end">$3.75</text>
  
  <text x="60" y="280" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#334155">1x Organic Coffee Beans</text>
  <text x="340" y="280" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#334155" text-anchor="end">$12.00</text>
  
  <line x1="50" y1="315" x2="350" y2="315" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  
  <!-- Subtotal and Tax -->
  <text x="60" y="350" font-family="'Courier New', Courier, monospace" font-size="13" fill="#475569">Subtotal</text>
  <text x="340" y="350" font-family="'Courier New', Courier, monospace" font-size="13" fill="#475569" text-anchor="end">$20.25</text>
  
  <text x="60" y="380" font-family="'Courier New', Courier, monospace" font-size="13" fill="#475569">Sales Tax (8.5%)</text>
  <text x="340" y="380" font-family="'Courier New', Courier, monospace" font-size="13" fill="#475569" text-anchor="end">$1.75</text>
  
  <line x1="50" y1="410" x2="350" y2="410" stroke="#334155" stroke-width="2"/>
  
  <!-- Total -->
  <text x="60" y="450" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="bold" fill="#0f172a">TOTAL AMOUNT</text>
  <text x="340" y="450" font-family="'Courier New', Courier, monospace" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="end">$22.00</text>
  
  <line x1="50" y1="480" x2="350" y2="480" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  
  <!-- Bottom note -->
  <text x="200" y="515" font-family="'Courier New', Courier, monospace" font-size="11" fill="#64748b" text-anchor="middle">THANK YOU FOR YOUR VISIT!</text>
  <text x="200" y="535" font-family="'Courier New', Courier, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Sample receipt generated for AI OCR testing</text>
</svg>
